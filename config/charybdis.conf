# Nombre del teclado
CONFIG_ZMK_KEYBOARD_NAME="Charybdis"

# Activar soporte de Ratón/Trackball (VITAL)
CONFIG_ZMK_POINTING=y

# Bluetooth
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=9
CONFIG_BT_PERIPHERAL_PREF_LATENCY=4
#CONFIG_BT_BUF_ACL_TX_COUNT=24
#CONFIG_BT_L2CAP_TX_BUF_COUNT=24
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Si usas ZMK Studio (opcional, pero recomendado para el futuro)
# CONFIG_ZMK_STUDIO=y


# 启用键盘RGB功能
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y
# CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
